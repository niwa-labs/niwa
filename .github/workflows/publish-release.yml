name: Publish GitHub release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Niwa release tag, such as v0.1.0
        required: false
        type: string
      verify_only:
        description: Check the tag and app credentials without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="$TAG_INPUT"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'Select an existing version tag in the form v1.2.3.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent
          printf 'name=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Authenticate as Niwa Mori
        id: mori
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NIWA_MORI_APP_ID }}
          private-key: ${{ secrets.NIWA_MORI_PRIVATE_KEY }}
          permission-contents: write

      - name: Verify repository access
        if: inputs.verify_only
        env:
          GH_TOKEN: ${{ steps.mori.outputs.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --silent

      - name: Publish the release as Niwa Mori
        if: "!inputs.verify_only"
        env:
          GH_TOKEN: ${{ steps.mori.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
